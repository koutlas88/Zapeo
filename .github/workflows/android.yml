name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Ajustes para Android TV
        run: python3 tv/patch_android.py
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp tv/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zapeo.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Zapeo ${{ github.run_number }}
          files: zapeo.apk
          make_latest: true
